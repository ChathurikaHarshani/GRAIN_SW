{% extends "base.html" %}

{% block title %}Carts | GMS{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0 ">Carts</h1>
    <a href="{{ url_for('new_cart') }}" class="btn btn-primary">+ Add Cart</a>
  </div>
  <!-- <a href="{{ url_for('dashboard') }}" class="btn btn-link">&larr; Back to Home</a> -->

  {% if carts %}
  <div class="table-responsive">
    <table class="table table-striped table-hover mt-3 gms-filter-table" data-search-label="carts">
      <thead><tr><th>Cart Code</th><th>Cart Name</th><th>Actions</th></tr></thead>
      <tbody>
      {% for c in carts %}
        <tr><td>{{ c.Cart_Code }}</td><td>{{ c.Cart_Name }}</td><td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('edit_cart', cart_id=c.Cart_ID) }}">Edit</a></td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
    <p class="mt-3">No carts found. Click “Add Cart”.</p>
  {% endif %}
</div>

{% endblock %}
