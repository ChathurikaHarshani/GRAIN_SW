{% extends "base.html" %}

{% block title %}{{ 'Edit' if storage_item else 'Add' }} Storage Bin | GMS{% endblock %}

{% block content %}
<div class="container py-4">

  <h1 class="mb-4 ">{{ 'Edit' if storage_item else 'Add' }} Storage Bin</h1>
  <a href="{{ url_for('list_storage') }}" class="btn btn-link">&larr; Back to Storage Bins</a>

  {% if error %}
    <div class="alert alert-danger mt-3">{{ error }}</div>
  {% endif %}

  <form method="post" class="mt-3">
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label ">Bin Code *</label>
        <input type="text" class="form-control" name="bin_code" value="{{ storage_item.Bin_Code if storage_item else '' }}" required>
      </div>
      <div class="col-md-5 mb-3">
        <label class="form-label ">Bin Name *</label>
        <input type="text" class="form-control" name="bin_name" value="{{ storage_item.Bin_Name if storage_item else '' }}" required>
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label ">Capacity (bu) *</label>
        <input type="number" step="0.01" class="form-control" name="bin_capacity" value="{{ storage_item.Bin_Capacity if storage_item else '' }}" required>
      </div>
    </div>

    <div class="row">
      <div class="col-md-3 mb-3">
        <label class="form-label ">Diameter (ft)</label>
        <input type="number" step="0.01" class="form-control" name="diameter" value="{{ storage_item.Diameter if storage_item and storage_item.Diameter is not none else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label ">Install Date</label>
        <input type="datetime-local" class="form-control" name="install_date" value="{{ storage_item.Install_Date.strftime('%Y-%m-%dT%H:%M') if storage_item and storage_item.Install_Date else '' }}">
      </div>
      <div class="col-md-5 mb-3">
        <label class="form-label ">Manufacturer</label>
        <input type="text" class="form-control" name="manufacture" value="{{ storage_item.Manufacture if storage_item and storage_item.Manufacture else '' }}">
      </div>
    </div>

    <div class="row">
      <div class="col-md-3 mb-3">
        <label class="form-label  ">Latitude</label>
        <input type="number" step="0.0000001" class="form-control" name="lattitude" value="{{ storage_item.Lattitude if storage_item and storage_item.Lattitude is not none else '' }}">
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label ">Longitude</label>
        <input type="number" step="0.0000001" class="form-control" name="lontitude" value="{{ storage_item.Lontitude if storage_item and storage_item.Lontitude is not none else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label ">Legal Description</label>
        <input type="text" class="form-control" name="legal_desc" value="{{ storage_item.Legal_Desc if storage_item and storage_item.Legal_Desc else '' }}">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Save</button><a href="{{ url_for('list_storage') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>

</div>
{% endblock %}
