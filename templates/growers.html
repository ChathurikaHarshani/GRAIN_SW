{% extends "base.html" %}

{% block title %}Growers | GMS{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0 ">Growers</h1>
  </div>

  <!-- <a href="{{ url_for('dashboard') }}" class="btn btn-link">&larr; Back to Home</a> -->

  {% if growers %}
  <div class="table-responsive">
    <table class="table table-striped table-hover mt-3 gms-filter-table" data-search-label="growers">
      <thead>
        <tr>
          <th>Grower Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for g in growers %}
          <tr>
            <td>{{ g.Grower_Name }}</td>
            <td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('edit_grower', grower_id=g.Grower_ID) }}">Edit</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
    <p class="mt-3">No growers found. Click “Add Grower” to create one.</p>
  {% endif %}

</div>
{% endblock %}
