{% extends "base.html" %}

{% block title %}{{ 'Edit' if cart else 'Add' }} Cart | GMS{% endblock %}

{% block content %}

<div class="container py-4">
  <h1 class="mb-4 ">{{ 'Edit' if cart else 'Add' }} Cart</h1>
  <a href="{{ url_for('list_carts') }}" class="btn btn-link">&larr; Back to Carts</a>

  {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label class="form-label ">Cart Code</label>
      <input type="text" class="form-control" name="cart_code" value="{{ cart.Cart_Code if cart else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label ">Cart Name</label>
      <input type="text" class="form-control" name="cart_name" value="{{ cart.Cart_Name if cart else '' }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button><a href="{{ url_for('list_carts') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>
</div>


{% endblock %}
