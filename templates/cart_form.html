{% extends "base.html" %}

{% block title %}{{ 'Edit' if cart else 'Add' }} Cart | GMS{% endblock %}

{% block content %}

<div class="container py-4">
  <h1 class="mb-4 ">{{ 'Edit' if cart else 'Add' }} Cart</h1>
  <a href="{{ url_for('list_carts') }}" class="btn btn-link">&larr; Back to Carts</a>

  {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label class="form-label ">Cart Code</label>
      <input type="text" class="form-control" name="cart_code" value="{{ request.form.get('cart_code', cart.Cart_Code if cart else '') }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label ">Cart Name</label>
      <input type="text" class="form-control" name="cart_name" value="{{ request.form.get('cart_name', cart.Cart_Name if cart else '') }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="load_cell">Load Cell</label>
      <input type="text" class="form-control" id="load_cell" name="load_cell" maxlength="100" value="{{ request.form.get('load_cell', (cart.Load_Cell or '') if cart else '') }}">
    </div>
    <button type="submit" class="btn btn-primary">Save</button><a href="{{ url_for('list_carts') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>
</div>


{% endblock %}
