<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up GMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:640px">
<div class="card shadow-sm"><div class="card-body p-4 p-md-5"><h1>Set up GMS</h1>
<p class="text-muted">Create the first Grower and its administrator.</p>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post">
<div class="mb-3"><label class="form-label">Grower name</label><input class="form-control" name="grower_name" required></div>
<div class="mb-3"><label class="form-label">Administrator username</label><input class="form-control" name="username" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div>
<div class="mb-3"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="8" required></div>
<button class="btn btn-primary" type="submit">Create Grower and administrator</button>
</form></div></div></main></body></html>
